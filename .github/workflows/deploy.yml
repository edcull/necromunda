name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          CACHED_HASH=$(cat node_modules/.lock-hash 2>/dev/null || echo "")
          if [ "$LOCK_HASH" != "$CACHED_HASH" ]; then
            npm ci
            echo "$LOCK_HASH" > node_modules/.lock-hash
          else
            echo "node_modules up to date, skipping install"
          fi

      - name: Ensure data directory exists
        run: mkdir -p /home/archetek/necromunda-data

      - name: Restart service
        run: sudo systemctl restart necromunda
